<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Auditoria local — Kika</title><style>body{margin:0;background:#deded9;font:14px system-ui}header{padding:8px;display:flex;gap:10px}button{padding:10px}iframe{display:block;border:0;height:844px;margin:0 auto;background:white}pre{white-space:pre-wrap;font-size:12px;padding:10px}</style><header><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><button id="integration">Executar testes locais de API</button></header><iframe title="Prévia auditada" src="/" style="width:390px"></iframe><pre id="results">Pronto para auditoria local. Nenhuma chamada a provedor financeiro.</pre><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');
const uuid=()=>{const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=Array.from(b,v=>v.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};
document.querySelector('#integration').onclick=async()=>{if(!['terminal.local','localhost','127.0.0.1'].includes(location.hostname)){document.querySelector('#results').textContent='Testes permitidos apenas na prévia local.';return;}const out=document.querySelector('#results');out.textContent='Executando somente na origem local…';const results=[];const check=(name,ok)=>results.push({name,passed:ok});const id=uuid(),token=uuid();const payload={id,token,items:[{id:'frango',qty:2,size:'G',side:'Legumes',extras:['ovo'],note:'Auditoria local'}],fulfillment:'entrega',zone:1,customer:'Auditoria local',phone:'11000000000',address:'Endereço fictício para teste local',total:1};const post=(p)=>fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});try{
let r=await post(payload);let d=await r.json();check('registro local com preço recalculado',r.status===200&&d.total===6880&&d.payment==='não cobrado');
r=await post(payload);d=await r.json();check('retentativa idempotente retorna mesmo pedido',r.status===200&&d.id===id&&d.total===6880);
r=await post({...payload,customer:'Outro payload'});check('mesma chave com payload diferente rejeitada',r.status===409);
r=await fetch('/api/orders?id='+id,{headers:{'x-order-token':token}});d=await r.json();check('consulta autenticada do pedido local',r.status===200&&d.total===6880&&!('token' in d)&&!('requestHash' in d));
r=await fetch('/api/orders?id='+id,{headers:{'x-order-token':uuid()}});check('consulta com token errado negada',r.status===404);
r=await post({...payload,id:uuid(),address:'x'});check('endereço incompleto rejeitado',r.status===400);
r=await post({...payload,id:uuid(),items:[{...payload.items[0],qty:-1}]});check('quantidade inválida rejeitada',r.status===400);
r=await fetch('/api/admin');check('gestão sem chave negada',r.status===401);
r=await fetch('/api/admin',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'concluído'})});check('alteração administrativa sem chave negada',r.status===401);
out.textContent=JSON.stringify({origin:location.origin,tests:results},null,2);
}catch(e){out.textContent=JSON.stringify({tests:results,error:String(e)},null,2)}};
</script></html>
